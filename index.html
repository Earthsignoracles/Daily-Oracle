<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthSign.Oracles | Magic Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #020205; /* 極致黑 */
            font-family: 'Georgia', serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 1. 魔法星雲背景 */
        .galaxy-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(40, 20, 80, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(20, 50, 90, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #050508 0%, #020205 100%);
            z-index: -10; /* 最底層 */
            filter: blur(30px);
            animation: nebulaFlow 20s ease-in-out infinite alternate;
        }

        @keyframes nebulaFlow {
            from { transform: scale(1); }
            to { transform: scale(1.1) rotate(2deg); }
        }

        /* 2. 繁星容器 - 確保 z-index 在背景之上 */
        #starsBox {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -5; /* 高於背景，低於內容 */
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff, 0 0 10px #fff; /* 增加發光感 */
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        .dust {
            position: absolute;
            background: rgba(212, 175, 55, 0.6); /* 加深金色星塵 */
            border-radius: 50%;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 3. 內容排版區 */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }

        .brand-name {
            font-family: 'Philosopher', serif;
            font-size: 3.5rem;
            color: #ffffff;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .welcome-box {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 25px;
            line-height: 1.8;
            font-size: 1.15rem;
        }

        .shop-link {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #fff;
            padding-bottom: 3px;
        }

        @media (max-width: 480px) {
            .brand-name { font-size: 2.2rem; }
            .welcome-box { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="galaxy-bg"></div>
    <div id="starsBox"></div> <div class="content-wrapper">
        <h1 class="brand-name">EarthSign.Oracles</h1>
        
        <div class="welcome-box">
            Welcome to our <strong>FREE card drawing</strong>!<br><br>
            For this card drawing, the collection that you are seeing is the <strong>Daily Oracles Collection</strong>. <br><br>
            There's more collection on my website, feel free to go to my shop and have a look below.
            <br>
            <a href="https://payhip.com/YOUR_SHOP_LINK" class="shop-link">Visit My Shop ✨</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const starsBox = document.getElementById('starsBox');
            
            // 生成 100 顆閃爍白色繁星
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1; // 稍微調大一點確保看得到
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                starsBox.appendChild(star);
            }

            // 生成 50 顆金色星塵
            for (let i = 0; i < 50; i++) {
                const dust = document.createElement('div');
                dust.className = 'dust';
                const size = Math.random() * 2;
                dust.style.width = size + 'px';
                dust.style.height = size + 'px';
                dust.style.top = Math.random() * 100 + '%';
                dust.style.left = Math.random() * 100 + '%';
                starsBox.appendChild(dust);
            }
        });
    </script>
</body>
</html>
